version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - server/.env
    depends_on:
      - mongo
      - redis
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-changeme}@mongo:27017/annasagar_travels?authSource=admin
      REDIS_URL: redis://redis:6379

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html/client:ro
      - ./admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
